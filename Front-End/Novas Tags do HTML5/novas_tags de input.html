<!DOCTYPE html>
<html>
<head>
	<title>Novas tags de input html 5</title>
	<meta charset="utf-8">

	<!-- Estilo customizado-->
	<link rel="stylesheet" type="text/css" href="css/estilo.css">


</head>

<body>

	<form>
		<!-- Novos Inputs e atributos HTML 5 -->
		<label for="nome">Nome</label>
		<input type="text" name="nome" id="nome" autofocus>
		<br><br>

		<label for="nome">Email</label>
		<input type="email" id="email" required>
		<br><br>

		<!-- Numero -->
		<label for="numero">Número</label>
		<input type="number" id="numero" min="4" max="8" step="5">
		<br><br>

		<!---URL--->
		<label for="pesquisa">Url</label>
		<input type="url" id="url" placeholder="ex: https//wwww.">
		<br><br>

		<!-- Pesquisa-->
		<label for="pesquisa">Pesquisa</label>
		<input type="search" id="pesquisa">
		<br><br>

		<!-- Data-->
		<label for="data">Data</label>
		<input type="date" id="data">
		<br><br>
		


		<input type="submit" name="" value="Enviar">

	</form>

</body>
</html>
