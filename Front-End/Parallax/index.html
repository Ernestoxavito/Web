<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
	<title>
		Parallax
	</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<style type="text/css">

		/* Configuração padrão da página */
		body, html {
			margin: 0px;
			font: 16px "Lato", sans-serif;
			color: #777;
			height: 100%;
			 
		}
		
		.conteudo {
			color: #777;
			background-color: white;
			text-align: justify;
			padding: 50px 80px;
		}

		h3 {
			text-transform: uppercase;
			color: #111;
			text-align: center;
		}

		.caixa5, .caixa6, .caixa7 {
			height: 100%;
			background-repeat: no-repeat;
			background-size: cover;
			background-position: center;
			background-attachment: fixed;
		}

		/* Efeito Parallax */
		.caixa1, .caixa2, .caixa3, .caixa4 {
			
			height: 100%;
			background-repeat: no-repeat;
			background-size: cover;
			background-position: center;
			background-attachment: fixed;

		}

		.caixa1 {
			background-image: url(imagens/imagem1.jpg);
		}

		.caixa2 {
			background-image: url(imagens/imagem2.jpg);
		}

		.caixa3 {
			background-image: url(imagens/imagem3.jpg);
		}

		.caixa4 {
			background-image: url(imagens/imagem4.jpg);
		}

		.caixa5 {
			background-image: url(imagens/imagem5.jpg);
		}

		.caixa6 {
			background-image: url(imagens/imagem6.jpg);
		}
		.caixa7 {
			background-image: url(imagens/lua.jpg);
		}

		.conteudo-titulo {
			position: absolute;
			left: 0%;
			top: 45%;
			width: 100%;
			text-align: center;
		}

		.conteudo-titulo span.titulo  {
			color: #fff;
			background-color: #111;
			padding: 18px;
			letter-spacing: 5px;
			font-size: 25px;
			
		}

		
	</style>
	
</head>
<body>

	<div class="caixa1">
		
	</div>

	<div class="conteudo">
		<h3>Parallax</h3>
		<p>Uma vez que os usúarios de telefonia tradicional vem aumentando a cada dia que passa, daí que optou-se pelo uso de VOIP, levando em consideração que há necessiidade de uma rede estável para que o sistema funcione na transmissão de voz em tempo real e sem interrupções.</p>
	</div>

	<div class="caixa2">
		<div class="conteudo-titulo">
			<span class="titulo">A estrada</span>
		</div>
	</div>

	<div class="caixa3">
		
	</div>

	<div class="caixa4">
		<div class="conteudo-titulo">
			<span class="titulo">A estrada</span>
		</div>
	</div>

	<div class="caixa5">

	</div>

	<div class="caixa6">

	</div>

</body>
</html>
