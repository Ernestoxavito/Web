<script type="text/javascript">
	
	function pulalinha() {
		document.write("<br>");
		document.write("<br>");
	}
	function mostra(frase) {
		document.write(frase);
		pulalinha();
	}

	var multiplicador = 1;
	while(multiplicador <=10) {
		mostra(7 * multiplicador);
		multiplicador = multiplicador + 1;
	}

	mostra("fim"); 

</script>
