<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores do fundo </title>

    <script>
        function modificaEstilo(corDeFundo) {
            document.getElementById("quadrado").style.background=corDeFundo
        }
    </script>
</head>
<body>
    <h1>Manipulando Estilo</h1>

    <button type="button" onclick="modificaEstilo(`#FF0000`)">Vermelho</button>
    <button type="button" onclick="modificaEstilo(`#00FF00`)">Verde</button>
    <button type="button" onclick="modificaEstilo(`#0000FF`)">Azul</button>

    <hr>
    <div style="border: solid 2px #000; width: 100px; height: 100px;" id="quadrado"></div>
</body>
</html>
