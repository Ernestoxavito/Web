<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sobrepondo elementos</title>

	<style type="text/css">
		
		a {
			padding: 5px 10px;
			text-decoration: none;
		}

		/*Links não Visitados*/
		a:link {
			color: #b9c941;
		}

		/*Links  Visitados*/
		a:visited {
			color: #c0c0c0;
		}
		/*Links  hover, passar o cursor sobre o link*/
		a:hover{
			background: #6d790f;
			color: #FFF;
		}
		/*Links  ativado, quando clicado*/
		a:active{
			color: #e4f371;
		}


	</style>
