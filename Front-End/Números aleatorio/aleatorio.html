<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/estilo.css">
    <title>Números aleatorios</title>
</head>
<body>

    <div class="container">
        <h2>Gerador de Números</h2>

        <div class="input-group">
            <div class="input-field">
                <label for="min">Min:</label>
                <input id="min" type="number" name="min">
            </div>
            <div class="input-field">
            <label for="max">Max:</label>
            <input id="max" type="number" name="max"> 
            </div>
        </div>

        <button id="generate">Gerar</button>
        <div id="result">
            <span>
                00
            </span>
        </div>
    </div>

    <script type="text/javascript" src="JS/aleatorio.js"></script>
    
</body>
</html>
