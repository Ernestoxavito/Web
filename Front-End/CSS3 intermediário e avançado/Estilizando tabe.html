<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Estilizando tabela</title>

	<!-- Estilo customizado -->
	<link rel="stylesheet" type="text/css" href="css/estilo.css">

</head>

<body>

	<h2>Estilizando tabela</h2>

	<table>
		<tr>
			<th>Código</th>
			<th>Produtos</th>
			<th class="numero">Preços</th>
		</tr>
		<tr>
			<td>001</td>
			<td>Notbook</td>
			<td class="numero">2000.kz</td>
		</tr>
		<tr class="alternado">
			<td>002</td>
			<td>Desktop</td>
			<td class="numero">20.000.kz</td>
		</tr>
		<tr>
			<td>003</td>
			<td>Impressora</td>
			<td class="numero">10.000.kz</td>
		</tr>
		<tr>
			<td>004</td>
			<td>Iphone</td>
			<td class="numero">2000.kz</td>
		</tr>
	</table>

</body>
</html>
